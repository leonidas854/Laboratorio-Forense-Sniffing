version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forensics_db
    environment:
      POSTGRES_USER: forensics_user
      POSTGRES_PASSWORD: supersecretpassword123
      POSTGRES_DB: forensics_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: forensics_webapp
    environment:
      - DATABASE_URL=postgresql://forensics_user:supersecretpassword123@postgres:5432/forensics_db
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: always

volumes:
  pgdata:
