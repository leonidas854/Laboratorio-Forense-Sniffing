# Solo Nginx publica puertos. HTTP activo; HTTPS se habilita manualmente.
services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-forensics_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y define DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-forensics_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: k8s-file
      options:
        max-size: 10m

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${DB_USER:-forensics_user}
      PGPASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      PGDATABASE: ${DB_NAME:-forensics_db}
      NODE_ENV: production
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: k8s-file
      options:
        max-size: 10m

  nginx:
    image: docker.io/library/nginx:stable-alpine
    user: "101:101"
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    ports:
      - "${LAB_BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
      # HTTPS FUTURO: descomentar tras seguir doscs/03-https.md.
      # - "${LAB_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,Z
      - ./nginx/snippets:/etc/nginx/snippets:ro,Z
      # HTTPS FUTURO: descomentar con certificados y permisos preparados.
      # - ./nginx/certs:/etc/nginx/certs:ro,Z
    networks: [backend]
    depends_on:
      webapp:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 50
    logging:
      driver: k8s-file
      options:
        max-size: 10m

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
