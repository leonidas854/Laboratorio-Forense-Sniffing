name: Laboratorio HTTP
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            playwright-client/package-lock.json
      - name: Lint
        run: npm ci --prefix webapp && npm run lint --prefix webapp
      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          npm ci --prefix playwright-client
          cd playwright-client && npx playwright install --with-deps chromium
      - name: Desplegar HTTP
        run: |
          cp .env.example .env
          make lab-up
          make validate
      - name: Navegador y API a través de Nginx
        run: make simulate-client
      - name: Logs
        if: always()
        run: podman-compose logs --tail=100
      - name: Detener
        if: always()
        run: podman-compose down
